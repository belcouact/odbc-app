<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ODBC Query App — 54s Promo</title>
<style>
:root{--navy:#081a2d;--teal:#14B8A6;--teal2:#2dd4bf;--blue:#3B82F6;--sky:#7dd3fc;--ink:#0f172a;--ink2:#334155;--mute:#64748b;--line:#e5eaf0;--soft:#f6f8fb}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:"Lora","LXGW WenKai Screen","Kaiti SC",STKaiti,KaiTi,"楷体",Georgia,"Times New Roman",serif;color:#fff;-webkit-font-smoothing:antialiased}
/* ---------- bilingual ---------- */
body:not(.L-en) .le{display:none}
body.L-en .lz{display:none}
body.L-en .sub2{display:none}
body.L-en .cap .hd{font-size:58px}
body.L-en .cap{width:610px}
.mono{font-family:"Cascadia Code",Consolas,"JetBrains Mono","DejaVu Sans Mono",monospace}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;
  background:radial-gradient(1500px 900px at 70% 25%,#123b63 0%,#081a2d 50%,#030b16 100%)}
#bg{position:absolute;inset:0}
.floor{position:absolute;left:-20%;right:-20%;bottom:-10%;height:55%;
  background-image:linear-gradient(rgba(125,211,252,.10) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(125,211,252,.10) 1.5px,transparent 1.5px);
  background-size:80px 80px;transform:perspective(700px) rotateX(62deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 85%);mask-image:linear-gradient(to top,#000 0%,transparent 85%)}
.orb{position:absolute;border-radius:50%}
.scene{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
.center{position:absolute;left:0;right:0;text-align:center}
.cap{position:absolute;left:140px;top:290px;width:600px}
.kick{font-size:22px;letter-spacing:.28em;color:var(--teal2);font-weight:700}
.kick b{display:inline-block;width:46px;height:3px;background:var(--teal2);vertical-align:middle;margin-right:14px}
.hd{font-size:66px;font-weight:700;line-height:1.15;margin:22px 0 22px;letter-spacing:-.01em}
.hd em{font-style:normal;background:linear-gradient(90deg,#7dd3fc,#2dd4bf);-webkit-background-clip:text;background-clip:text;color:transparent}
.bd{font-size:26px;line-height:1.6;color:#b6c8db}
.en{font-size:19px;letter-spacing:.06em;color:#6f8aa6;margin-top:18px}
.win{position:absolute;background:#fff;border-radius:18px;overflow:hidden;color:var(--ink);
  box-shadow:0 40px 100px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
.tbar{height:46px;background:#f3f6fa;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:10px;font-size:15px;color:var(--ink2);font-weight:600}
.tbar .sp{flex:1}.tbar .wc{color:#94a3b8;letter-spacing:14px;font-weight:400}
.chip{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;font-size:22px;font-weight:600;white-space:nowrap}
.dchip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#e2e8f0}
.tchip{background:rgba(20,184,166,.16);border:1px solid rgba(45,212,191,.5);color:#99f6e4}
.big{font-size:100px;font-weight:800;letter-spacing:-.02em}
.sqlwall{position:absolute;left:0;right:0;top:0;bottom:0;font-size:22px;line-height:1.55;color:#5b7a99;white-space:pre;padding:60px 120px;overflow:hidden}
.row{display:grid;grid-template-columns:1.2fr .55fr 1.5fr .7fr 1.1fr;height:52px;align-items:center;padding:0 24px;font-size:19px;border-bottom:1px solid #eef2f6;background:#fff}
.row:nth-child(even){background:#fafbfd}
.gh{background:var(--soft);font-weight:700;color:var(--ink2);font-size:17px}
.tag{display:inline-block;padding:3px 13px;border-radius:999px;font-size:16px;white-space:nowrap}
.t0{background:#e0f2fe;color:#0369a1}.t1{background:#ccfbf1;color:#0f766e}.t2{background:#ede9fe;color:#6d28d9}.t3{background:#fef3c7;color:#b45309}.t4{background:#fce7f3;color:#be185d}.t5{background:#f1f5f9;color:#475569}
.dim{color:#94a3b8}
.tile{position:absolute;width:196px;height:150px;border-radius:16px;background:#fff;color:var(--ink2);box-shadow:0 14px 34px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:600}
.tile svg{width:120px;height:78px}
.card{position:absolute;background:#fff;border-radius:14px;color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.25);padding:18px 20px}
.card h4{font-size:17px;color:var(--mute);font-weight:600;margin-bottom:8px}
.kv{font-size:46px;font-weight:700}
.field{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.field label{width:120px;font-size:19px;color:var(--mute);font-weight:600}
.field .in{flex:1;height:48px;border:1.5px solid var(--line);border-radius:10px;display:flex;align-items:center;padding:0 16px;font-size:19px;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--blue),var(--teal))}
pre.code{white-space:pre;font-size:20px;line-height:1.7}
.kw{color:#7dd3fc}.str{color:#fcd34d}.num{color:#f9a8d4}.fn{color:#5eead4}.cm{color:#64748b}
.feat{position:absolute;width:340px;height:190px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);padding:22px 24px}
.feat .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#3B82F6,#14B8A6);margin-bottom:14px}
.feat b{display:block;font-size:24px}
.feat span{font-size:17px;color:#9fb3c8}
.layer{position:absolute;left:770px;width:880px;height:96px;border-radius:16px;display:flex;align-items:center;gap:22px;padding:0 30px;font-size:26px;font-weight:700;border:1px solid rgba(255,255,255,.18)}
.layer small{font-size:18px;font-weight:500;color:#bcd0e3;margin-left:auto}
/* ---------- AI insights scene ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.tab{padding:9px 16px;border-radius:10px;font-size:16px;font-weight:600;color:#8ba3bd;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}
.tab.on{color:#04211c;background:linear-gradient(135deg,#7dd3fc,#2dd4bf);border-color:transparent}
.aiq{margin:22px 24px 0 auto;width:66%;padding:15px 18px;border-radius:16px 16px 4px 16px;background:#3B82F6;color:#fff;font-size:18px;line-height:1.5}
.aiic{margin:18px 24px;border-radius:16px;background:#13263a;border:1px solid rgba(45,212,191,.22);padding:18px 22px}
.aiih{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;color:#99f6e4;margin-bottom:12px}
.aiir{display:flex;gap:14px;padding:10px 0;border-top:1px solid rgba(255,255,255,.06);font-size:16.5px;line-height:1.45;color:#cfe0f0}
.aiir b{flex:0 0 104px;color:#7d97b2;font-weight:600}
.aiir.am b{color:#fca5a5}
.aiok{position:absolute;left:24px;bottom:22px;display:inline-flex;align-items:center;gap:10px;padding:11px 18px;border-radius:999px;font-size:16px;font-weight:600;background:rgba(20,184,166,.15);border:1px solid rgba(45,212,191,.5);color:#99f6e4}
.airow{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.airow b{display:inline-flex;align-items:center;gap:9px;padding:10px 16px;border-radius:999px;font-size:16.5px;font-weight:600;color:#dbe7f3;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16)}
.airow b i{flex:0 0 9px;width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#14B8A6)}
#hud{position:absolute;left:140px;right:140px;bottom:60px;display:flex;gap:16px;opacity:0}
.hs{flex:1;font-size:17px;color:#6f8aa6;letter-spacing:.08em}
.hs i{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin-bottom:12px;overflow:hidden}
.hs i u{display:block;height:100%;width:0;background:linear-gradient(90deg,#3B82F6,#2dd4bf)}
.hs.on{color:#fff}
#brandMini{position:absolute;left:140px;top:64px;display:flex;align-items:center;gap:14px;font-size:24px;font-weight:700;opacity:0}

/* ---------- UI controls ---------- */
.ui{position:fixed;z-index:9;display:flex;gap:10px;align-items:center;font:13px "Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;color:#cbd5e1;transition:opacity .4s}
#top{top:16px;right:18px}
#ctl{left:16px;bottom:14px}
.seg{display:flex;background:rgba(8,20,36,.6);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:3px;backdrop-filter:blur(8px)}
.seg button{all:unset;cursor:pointer;padding:7px 15px;border-radius:999px;font-size:13px;color:#cbd5e1}
.seg button.on{background:#fff;color:#081a2d;font-weight:700}
.pill{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:rgba(8,20,36,.6);border:1px solid rgba(255,255,255,.16);color:#e2e8f0;font-size:13px;backdrop-filter:blur(8px)}
.pill:hover{background:rgba(255,255,255,.14)}
.pill.on{border-color:rgba(45,212,191,.7);color:#99f6e4;box-shadow:0 0 0 3px rgba(45,212,191,.15)}
.pill svg{width:16px;height:16px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.eq i{width:3px;background:#2dd4bf;border-radius:1px;height:3px}
.pill.on.playing .eq i{animation:eq .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s!important}.eq i:nth-child(3){animation-delay:.4s!important}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
#sk{width:320px;accent-color:#2dd4bf}
#tm{min-width:46px;font-variant-numeric:tabular-nums}
#hint{position:fixed;top:64px;right:18px;z-index:9;padding:8px 14px;border-radius:10px;background:rgba(20,184,166,.18);border:1px solid rgba(45,212,191,.5);color:#ccfbf1;font:13px "Segoe UI","Microsoft YaHei UI",system-ui;opacity:0;transition:opacity .4s;pointer-events:none}
body.idle .ui{opacity:0}
body.idle{cursor:none}
.capture .ui,.capture #hint{display:none!important}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div class="orb" id="orb1" style="width:760px;height:760px;background:radial-gradient(circle,rgba(20,184,166,.5) 0%,rgba(20,184,166,0) 65%);left:-260px;top:560px;opacity:.6"></div>
  <div class="orb" id="orb2" style="width:900px;height:900px;background:radial-gradient(circle,rgba(59,130,246,.55) 0%,rgba(59,130,246,0) 65%);right:-300px;top:-380px;opacity:.6"></div>
  <div class="floor" id="floor"></div>
  <div id="scenes"></div>
  <div id="brandMini"></div>
  <div id="hud"></div>
  <div id="flash" class="abs" style="inset:0;background:#fff;opacity:0;pointer-events:none"></div>
</div>

<div id="top" class="ui">
  <div class="seg"><button data-l="zh">中文</button><button data-l="en">EN</button></div>
  <button class="pill" id="snd" title="Sound / 音效"></button>
</div>
<div id="hint"></div>
<div id="ctl" class="ui">
  <button class="pill" id="pp">❚❚</button>
  <button class="pill" id="rs" title="Restart">↺</button>
  <input id="sk" type="range" min="0" max="54" step="0.01" value="0"><span id="tm">0.0s</span>
</div>

<script>
/* ================= language ================= */
const qs=new URLSearchParams(location.search);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let LANG=qs.get('lang')||store.get('promoLang')||((navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en');
const B=(zh,en)=>`<span class="lz">${zh}</span><span class="le">${en}</span>`;
const TB=(zh,en)=>`<tspan class="lz">${zh}</tspan><tspan class="le">${en}</tspan>`;

/* ================= timeline engine ================= */
const DUR=54;
const E={lin:p=>p,out:p=>1-Math.pow(1-p,3),in:p=>p*p*p,io:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  back:p=>{const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)}};
const TW=new Map(),FN=[],TY=[];
const R=r=>typeof r==='string'?document.querySelector(r):r;
const $=(s,r=document)=>R(r).querySelector(s),$$=(s,r=document)=>[...R(r).querySelectorAll(s)];
const H=html=>{const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild;};
function tw(el,t0,d,props,ease='out'){
  if(typeof el==='string') el=$(el);
  if(!el){console.warn('missing',t0);return;}
  if(!TW.has(el)) TW.set(el,{});
  const m=TW.get(el);
  for(const k in props){(m[k]=m[k]||[]).push({t0,d,a:props[k][0],b:props[k][1],e:E[ease]});m[k].sort((x,y)=>x.t0-y.t0);}
}
const IN=(el,t,d=.6,dy=40,e='out')=>tw(el,t,d,{o:[0,1],y:[dy,0]},e);
function fn(t0,t1,f){FN.push({t0,t1,f});}
function val(list,t){let cur=null;for(const k of list){if(k.t0<=t)cur=k;else break;}
  if(!cur) return list[0].a;const p=cur.d<=0?1:Math.min(1,(t-cur.t0)/cur.d);return cur.a+(cur.b-cur.a)*cur.e(p);}
function render(t){
  for(const [el,m] of TW){
    const g=k=>m[k]?val(m[k],t):null;
    const o=g('o'),x=g('x'),y=g('y'),s=g('s'),r=g('r'),sx=g('sx'),sy=g('sy'),bl=g('bl'),dash=g('dash');
    if(o!==null){el.style.opacity=o;el.style.visibility=o<=0.001?'hidden':'visible';}
    if(x!==null||y!==null||s!==null||r!==null||sx!==null||sy!==null)
      el.style.transform=`translate(${x||0}px,${y||0}px) rotate(${r||0}deg) scale(${(s??1)*(sx??1)},${(s??1)*(sy??1)})`;
    if(bl!==null) el.style.filter=bl>0.05?`blur(${bl}px)`:'none';
    if(dash!==null) el.style.strokeDashoffset=dash;
  }
  for(const f of FN){const p=Math.max(0,Math.min(1,(t-f.t0)/(f.t1-f.t0)));f.f(p,t);}
  drawBg(t);
}
function typer(el,str,t0,t1,useHl){
  TY.push([t0,t1]);
  fn(t0,t1,p=>{const s=typeof str==='object'?str[LANG]:str;
    if(p>=1&&useHl){el.innerHTML=hl(s);return;}
    el.textContent=s.slice(0,Math.round(p*s.length));});
}
function counter(el,to,t0,t1,f){fn(t0,t1,p=>{el.textContent=f(to*E.out(p));});}
function hl(s){s=s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return s.replace(/(#[^\n]*)|('[^']*'|"[^"]*")|\b(SELECT|FROM|WHERE|AND|GROUP|BY|ORDER|AS|DESC|DATE|import|for|in|print|def|return)\b|\b(COUNT|SUM|read_grid|groupby|mean|std|round|len)\b|\b(\d+(?:\.\d+)?)\b/g,
  (m,c,st,kw,f,n)=>c?`<span class="cm">${c}</span>`:st?`<span class="str">${st}</span>`:kw?`<span class="kw">${kw}</span>`:f?`<span class="fn">${f}</span>`:`<span class="num">${n}</span>`);}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const scenes=$('#scenes');
function scene(id,t0,t1,html){const el=H(`<div class="scene" id="${id}">${html}</div>`);scenes.appendChild(el);
  tw(el,t0,.5,{o:[0,1]},'io');tw(el,t1-.5,.5,{o:[1,0]},'io');return el;}

const LOGO=(id,sz)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 120 120" style="overflow:visible"><defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="120" y2="120"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
<g fill="none" stroke="url(#${id})" stroke-width="6" stroke-linecap="round">
<ellipse class="dr" pathLength="1" stroke-dasharray="1" cx="50" cy="28" rx="34" ry="11"/>
<path class="dr" pathLength="1" stroke-dasharray="1" d="M16 28v60c0 6 15 11 34 11"/>
<path class="dr" pathLength="1" stroke-dasharray="1" d="M84 28v20"/>
<path class="dr" pathLength="1" stroke-dasharray="1" d="M16 58c0 6 15 11 34 11"/></g>
<rect class="lb" x="62" y="80" width="10" height="20" rx="2" fill="#2dd4bf" style="transform-box:fill-box;transform-origin:bottom"/>
<rect class="lb" x="77" y="66" width="10" height="34" rx="2" fill="#38bdf8" style="transform-box:fill-box;transform-origin:bottom"/>
<rect class="lb" x="92" y="52" width="10" height="48" rx="2" fill="#7dd3fc" style="transform-box:fill-box;transform-origin:bottom"/></svg>`;
const ICO={
 db:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>`,
 lock:`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 11V8a4 4 0 0 1 8 0v3"/><rect x="5" y="11" width="14" height="10" rx="2"/></svg>`,
 check:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>`,
 spark:(c='#fff',s=26)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M12 2l2.2 6.3L20.5 10.5 14.2 12.7 12 19l-2.2-6.3L3.5 10.5l6.3-2.2z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>`,
 dna:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M7 3c0 6 10 6 10 12s-10 3-10 6M17 3c0 6-10 6-10 12"/><path d="M8 7h8M8 17h8"/></svg>`,
 flow:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="7" height="6" rx="1.5"/><rect x="14" y="15" width="7" height="6" rx="1.5"/><path d="M6.5 9v5a2 2 0 0 0 2 2H14"/></svg>`,
 chat:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8"/></svg>`,
 upd:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>`,
 save:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>`,
 hist:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`
};

/* ================= background particles ================= */
const bgc=$('#bg').getContext('2d');
const P=Array.from({length:110},()=>({x:rnd()*1920,y:rnd()*1080,vx:(rnd()-.5)*22,vy:-6-rnd()*18,r:.8+rnd()*2.4,a:.15+rnd()*.55,h:180+rnd()*40,ph:rnd()*6}));
function drawBg(t){
  bgc.clearRect(0,0,1920,1080);
  const boost=1+(t>4.2&&t<5.4?(1-Math.abs(t-4.8)/.6)*2.5:0);
  for(const p of P){
    const x=((p.x+p.vx*t)%1920+1920)%1920,y=((p.y+p.vy*t*boost)%1080+1080)%1080;
    const a=p.a*(.6+.4*Math.sin(t*1.6+p.ph));
    const g=bgc.createRadialGradient(x,y,0,x,y,p.r*6);
    g.addColorStop(0,`hsla(${p.h},100%,82%,${a})`);g.addColorStop(1,`hsla(${p.h},100%,60%,0)`);
    bgc.fillStyle=g;bgc.beginPath();bgc.arc(x,y,p.r*6,0,7);bgc.fill();
  }
}
tw('#orb1',0,54,{x:[0,240],y:[0,-160]},'lin');
tw('#orb2',0,54,{x:[0,-220],y:[0,140]},'lin');
tw('#floor',0,54,{y:[0,-80]},'lin');

/* =====================================================================
   SOUND ENGINE — 100% synthesized with Web Audio (no files, works offline)
   ===================================================================== */
function buildGraph(ctx){
  const G={ctx};
  const g=v=>{const n=ctx.createGain();n.gain.value=v;return n;};
  G.master=g(.85);
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.2;
  G.master.connect(comp);comp.connect(ctx.destination);
  G.music=g(.34);G.music.connect(G.master);
  G.sfx=g(.75);G.sfx.connect(G.master);
  G.rev=ctx.createConvolver();
  const len=Math.floor(ctx.sampleRate*2.6),ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  G.rev.buffer=ir;const ro=g(.42);G.rev.connect(ro);ro.connect(G.master);
  const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  G.noise=nb;return G;
}
const A={
  vca(G,w,a,peak,d,dest){const n=G.ctx.createGain();n.gain.setValueAtTime(.0001,w);n.gain.linearRampToValueAtTime(peak,w+a);n.gain.exponentialRampToValueAtTime(.0001,w+a+d);n.connect(dest);return n;},
  osc(G,type,f0,f1,w,dur,dest,det=0){const o=G.ctx.createOscillator();o.type=type;o.detune.value=det;o.frequency.setValueAtTime(f0,w);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,w+dur);o.connect(dest);o.start(w);o.stop(w+dur+.05);return o;},
  nz(G,w,dur,dest){const s=G.ctx.createBufferSource();s.buffer=G.noise;s.loop=true;s.connect(dest);s.start(w,Math.random()*1.5);s.stop(w+dur+.05);return s;},
  filt(G,type,f,Q,dest){const b=G.ctx.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=Q;b.connect(dest);return b;},
  send(G,node,amt){const n=G.ctx.createGain();n.gain.value=amt;node.connect(n);n.connect(G.rev);},
  pan(G,from,to,w,dur,dest){const p=G.ctx.createStereoPanner();p.pan.setValueAtTime(from,w);p.pan.linearRampToValueAtTime(to,w+dur);p.connect(dest);return p;}
};
const SFX={
  whoosh(G,w){const g=A.vca(G,w,.22,.5,.5,G.sfx);A.send(G,g,.3);const p=A.pan(G,-.7,.7,w,.7,g);
    const f=A.filt(G,'bandpass',300,1.3,p);f.frequency.setValueAtTime(300,w);f.frequency.exponentialRampToValueAtTime(3800,w+.3);f.frequency.exponentialRampToValueAtTime(600,w+.75);A.nz(G,w,.8,f);},
  swipe(G,w){const g=A.vca(G,w,.02,.28,.16,G.sfx);const f=A.filt(G,'highpass',1500,.8,g);f.frequency.setValueAtTime(1500,w);f.frequency.exponentialRampToValueAtTime(7000,w+.18);A.nz(G,w,.2,f);},
  riser(G,w,dur){const g=G.ctx.createGain();g.gain.setValueAtTime(.0001,w);g.gain.exponentialRampToValueAtTime(.45,w+dur);g.gain.exponentialRampToValueAtTime(.0001,w+dur+.06);g.connect(G.sfx);A.send(G,g,.4);
    const f=A.filt(G,'bandpass',200,2,g);f.frequency.setValueAtTime(200,w);f.frequency.exponentialRampToValueAtTime(6000,w+dur);A.nz(G,w,dur+.1,f);
    const lp=A.filt(G,'lowpass',1600,1,g);A.osc(G,'sawtooth',90,700,w,dur,lp);},
  impact(G,w){const g=A.vca(G,w,.004,1,.9,G.sfx);A.send(G,g,.55);A.osc(G,'sine',150,36,w,.9,g);
    const g2=A.vca(G,w,.002,.55,.35,G.sfx);A.nz(G,w,.4,A.filt(G,'lowpass',900,.7,g2));},
  pop(G,w,p=1){const g=A.vca(G,w,.003,.26,.13,G.sfx);A.send(G,g,.18);A.osc(G,'sine',520*p,1100*p,w,.08,g);},
  click(G,w){const g=A.vca(G,w,.001,.38,.06,G.sfx);A.nz(G,w,.07,A.filt(G,'highpass',2500,.7,g));A.osc(G,'square',1500,900,w,.03,A.vca(G,w,.001,.06,.03,G.sfx));},
  tick(G,w){const g=A.vca(G,w,.001,.07+Math.random()*.05,.025,G.sfx);A.nz(G,w,.04,A.filt(G,'bandpass',3000+Math.random()*2500,2.2,g));},
  ding(G,w){[1318.5,1975.5].forEach((f,i)=>{const g=A.vca(G,w,.005,.16-i*.05,1.1,G.sfx);A.send(G,g,.5);A.osc(G,'sine',f,f,w,1.2,g);});},
  alert(G,w){[0,.15].forEach(k=>{const g=A.vca(G,w+k,.005,.09,.1,G.sfx);A.osc(G,'square',988,988,w+k,.12,A.filt(G,'lowpass',2600,.7,g));});},
  shimmer(G,w){[1568,1976,2349,2637,3136].forEach((f,i)=>{const g=A.vca(G,w+i*.05,.005,.06,1.2,G.sfx);A.send(G,g,.7);A.osc(G,'sine',f,f,w+i*.05,1.3,g);});},
  chime(G,w){[523.25,659.25,783.99,987.77,1174.66,1567.98].forEach((f,i)=>{const t=w+i*.07;const g=A.vca(G,t,.01,.11,3,G.sfx);A.send(G,g,.7);A.osc(G,'triangle',f,f,t,3.1,g);});},
  drone(G,w,dur){const g=G.ctx.createGain();g.gain.setValueAtTime(.0001,w);g.gain.linearRampToValueAtTime(.22,w+1.4);g.gain.setValueAtTime(.22,w+dur-.3);g.gain.linearRampToValueAtTime(.0001,w+dur);g.connect(G.music);A.send(G,g,.4);
    const lp=A.filt(G,'lowpass',260,1,g);lp.frequency.setValueAtTime(220,w);lp.frequency.linearRampToValueAtTime(900,w+dur);
    A.osc(G,'sawtooth',55,55,w,dur,lp);A.osc(G,'sawtooth',55,55,w,dur,lp,9);A.osc(G,'sine',110,110,w,dur,lp);},
  kick(G,w){const g=A.vca(G,w,.002,.95,.32,G.music);A.osc(G,'sine',160,44,w,.3,g);},
  hat(G,w){const g=A.vca(G,w,.001,.16,.045,G.music);A.nz(G,w,.06,A.filt(G,'highpass',7500,.7,g));},
  clap(G,w){const g=A.vca(G,w,.002,.32,.16,G.music);A.send(G,g,.3);A.nz(G,w,.2,A.filt(G,'bandpass',1600,1.1,g));},
  bass(G,w,f){const g=A.vca(G,w,.008,.42,.38,G.music);const lp=A.filt(G,'lowpass',700,4,g);lp.frequency.setValueAtTime(1200,w);lp.frequency.exponentialRampToValueAtTime(260,w+.3);A.osc(G,'sawtooth',f,f,w,.45,lp);A.osc(G,'sine',f/2,f/2,w,.45,g);},
  pad(G,w,ch,dur){ch.forEach(f=>{const g=G.ctx.createGain();g.gain.setValueAtTime(.0001,w);g.gain.linearRampToValueAtTime(.045,w+.45);g.gain.setValueAtTime(.04,w+dur-.25);g.gain.linearRampToValueAtTime(.0001,w+dur+.35);g.connect(G.music);A.send(G,g,.6);
    const lp=A.filt(G,'lowpass',1500,.8,g);A.osc(G,'sawtooth',f,f,w,dur+.4,lp,-8);A.osc(G,'sawtooth',f,f,w,dur+.4,lp,8);});}
};
/* ---- cue sheet (time-locked to the animation) ---- */
const CUES=[];const cue=(t,f)=>CUES.push({t,f});
(function buildCues(){
  // hook
  cue(0,(G,w)=>SFX.drone(G,w,4.6));cue(.25,(G,w)=>SFX.whoosh(G,w));cue(1.6,(G,w)=>SFX.whoosh(G,w));
  cue(2.9,(G,w)=>SFX.swipe(G,w));cue(3.35,(G,w)=>SFX.riser(G,w,1.0));cue(4.38,(G,w)=>SFX.impact(G,w));
  // brand
  cue(4.8,(G,w)=>SFX.shimmer(G,w));cue(5.55,(G,w)=>SFX.pop(G,w,1));cue(5.67,(G,w)=>SFX.pop(G,w,1.26));cue(5.79,(G,w)=>SFX.pop(G,w,1.5));cue(5.7,(G,w)=>SFX.whoosh(G,w));
  // scene transitions
  [9.4,14.6,20.4,25.4,28.55,32.6,37.6,43.6,48.6].forEach(t=>cue(t-.1,(G,w)=>SFX.whoosh(G,w)));
  // connect
  cue(9.9,(G,w)=>SFX.pop(G,w,.7));for(let i=0;i<6;i++)cue(10.5+i*.1,(G,w)=>SFX.pop(G,w,1+i*.12));
  [11.8,12.05,12.3].forEach((t,i)=>cue(t,(G,w)=>SFX.pop(G,w,1.4+i*.15)));cue(12.6,(G,w)=>SFX.click(G,w));
  // ask
  cue(17.6,(G,w)=>SFX.click(G,w));cue(17.0,(G,w)=>SFX.pop(G,w,1.2));cue(19.4,(G,w)=>SFX.ding(G,w));
  // see
  cue(22.7,(G,w)=>SFX.pop(G,w,1.1));cue(23.1,(G,w)=>SFX.pop(G,w,1.3));cue(23.5,(G,w)=>SFX.click(G,w));cue(24.0,(G,w)=>SFX.ding(G,w));
  // visualize
  for(let i=0;i<20;i++)cue(25.85+i*.045,(G,w)=>SFX.pop(G,w,1+(i%5)*.15));
  [29.1,29.22,29.34].forEach((t,i)=>cue(t,(G,w)=>SFX.pop(G,w,.9+i*.2)));cue(30.85,(G,w)=>SFX.alert(G,w));cue(30.4,(G,w)=>SFX.shimmer(G,w));
  // analyze
  cue(35.0,(G,w)=>SFX.ding(G,w));[34.0,34.25,34.5].forEach((t,i)=>cue(t,(G,w)=>SFX.pop(G,w,1+i*.2)));cue(34.9,(G,w)=>SFX.swipe(G,w));
  // ai insights
  cue(38.5,(G,w)=>SFX.click(G,w));for(let i=0;i<6;i++)cue(38.5+i*.07,(G,w)=>SFX.pop(G,w,.9+i*.1));
  cue(39.1,(G,w)=>SFX.pop(G,w,1.2));cue(39.5,(G,w)=>SFX.shimmer(G,w));
  for(let i=0;i<4;i++)cue(39.8+i*.22,(G,w)=>SFX.tick(G,w));
  for(let i=0;i<5;i++)cue(40.7+i*.16,(G,w)=>SFX.pop(G,w,1+i*.08));
  cue(42.6,(G,w)=>SFX.ding(G,w));
  // export
  cue(44.45,(G,w)=>SFX.click(G,w));for(let i=0;i<4;i++)cue(44.5+i*.1,(G,w)=>SFX.swipe(G,w));for(let i=0;i<6;i++)cue(45.2+i*.14,(G,w)=>SFX.pop(G,w,1+i*.1));
  // outro
  cue(49.8,(G,w)=>SFX.shimmer(G,w));cue(50.25,(G,w)=>SFX.riser(G,w,1.1));cue(51.35,(G,w)=>SFX.impact(G,w));cue(52.2,(G,w)=>SFX.chime(G,w));
  // typing ticks
  TY.forEach(([a,b])=>{for(let t=a;t<b;t+=.055)cue(t,(G,w)=>SFX.tick(G,w));});
  // music: 120 BPM, 1 bar = 2 s, Am – F – C – G
  const CH=[[220,261.63,329.63],[174.61,220,261.63],[196,261.63,329.63],[196,246.94,293.66]];
  const RT=[110,87.31,130.81,98];
  for(let k=0;k<26;k++){const b0=4.6+k*2,ci=k%4;
    if(b0>=51) break;
    cue(b0,(G,w)=>SFX.pad(G,w,CH[ci],2));

      const full=b0>=9.4&&b0<48.6;
      if(full||j===0) cue(t,(G,w)=>SFX.kick(G,w));
      if(full) cue(t+.25,(G,w)=>SFX.hat(G,w));

    }}

  CUES.sort((a,b)=>a.t-b.t);
})();

/* ---- live audio ---- */
const SND={on:false,G:null,fired:0};
function audioOn(){
  if(!SND.G){SND.G=buildGraph(new (window.AudioContext||window.webkitAudioContext)());}
  SND.G.ctx.resume();SND.G.master.gain.setTargetAtTime(.85,SND.G.ctx.currentTime,.05);
}
function audioOff(){if(SND.G){SND.G.master.gain.setTargetAtTime(0,SND.G.ctx.currentTime,.05);setTimeout(()=>SND.on||SND.G.ctx.suspend(),300);}}
function scheduleAudio(cur){
  if(!SND.on||!SND.G||SND.G.ctx.state!=='running') {SND.fired=cur;return;}
  const h=cur+.1,now=SND.G.ctx.currentTime;
  for(const c of CUES){if(c.t>SND.fired&&c.t<=h){try{c.f(SND.G,now+Math.max(0,c.t-cur));}catch(e){}}}
  SND.fired=h;
}
/* ---- offline soundtrack render (used by the MP4 export script) ---- */
window.renderSoundtrack=async()=>{
  const sr=44100,oc=new OfflineAudioContext(2,sr*DUR,sr),G=buildGraph(oc);
  for(const c of CUES) c.f(G,Math.max(0,c.t));
  const buf=await oc.startRendering();
  const n=buf.length,L=buf.getChannelData(0),Rc=buf.getChannelData(1),ab=new ArrayBuffer(44+n*4),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+n*4,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*4,true);
  for(let i=0,o=44;i<n;i++,o+=4){v.setInt16(o,Math.max(-1,Math.min(1,L[i]))*32767,true);v.setInt16(o+2,Math.max(-1,Math.min(1,Rc[i]))*32767,true);}
  const u=new Uint8Array(ab);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
  return btoa(s);
};

  $('#rs').onclick=()=>{cur=0;start=performance.now();SND.fired=-.01;render(0);if(!playing)pp.click();};
  sk.oninput=()=>{cur=+sk.value;start=performance.now()-cur*1000;SND.fired=cur;render(cur);};
  addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pp.click();}else if(e.key==='m'||e.key==='M')toggleSound();else if(e.key==='l'||e.key==='L')setLang(LANG==='en'?'zh':'en');});
  // remembered "sound on": browsers need one user gesture before audio can start
  if(store.get('promoSound')==='1'){SND.on=true;drawSnd();const hint=$('#hint');hint.innerHTML=B('点击任意处开启音效','Click anywhere to enable sound');hint.style.opacity=1;
    const go=()=>{audioOn();SND.fired=cur;hint.style.opacity=0;removeEventListener('pointerdown',go);removeEventListener('keydown',go);};
    addEventListener('pointerdown',go);addEventListener('keydown',go);}
  let idleT;const wake=()=>{document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),2500);};
  addEventListener('pointermove',wake);addEventListener('pointerdown',wake);wake();
  (function loop(n){
    if(playing){let t=(n-start)/1000;
      if(t>=DUR){t=DUR;playing=false;pp.textContent='▶';if(SND.G&&SND.on)SND.G.ctx.suspend();drawSnd();}
      cur=t;sk.value=cur;tm.textContent=cur.toFixed(1)+'s';render(cur);scheduleAudio(cur);}
    requestAnimationFrame(loop);
  })(performance.now());
}
</script>
</body>
