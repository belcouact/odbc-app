<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alex · Voxel Show</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#07080d;color:#e2e8f0;
  font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
body:not(.L-en) .le{display:none}
body.L-en .lz{display:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#gl.drag{cursor:grabbing}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,0,0,.6) 100%)}
.ui{position:fixed;z-index:5;transition:opacity .6s}
body.idle .ui.fade{opacity:0}
body.idle #gl{cursor:none}
:root{--acc:#fb923c}

#top{right:22px;top:20px;display:flex;gap:10px;align-items:center}
.seg{display:flex;background:rgba(12,14,22,.6);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px;backdrop-filter:blur(8px)}
.seg button{all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;font-size:12.5px;color:#cbd5e1}
.seg button.on{background:#fff;color:#0b0d14;font-weight:700}
.pill{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 15px;border-radius:999px;background:rgba(12,14,22,.6);
  border:1px solid rgba(255,255,255,.14);font-size:12.5px;color:#e2e8f0;backdrop-filter:blur(8px);white-space:nowrap}
.pill:hover{background:rgba(255,255,255,.12)}
.pill.on{border-color:var(--acc);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.pill svg{width:15px;height:15px}
.dot{width:8px;height:8px;border-radius:50%;background:#64748b}
.pill.on .dot{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.eq i{width:3px;height:3px;border-radius:1px;background:var(--acc)}
.pill.on .eq i{animation:eq .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s!important}.eq i:nth-child(3){animation-delay:.4s!important}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

#cap{left:0;right:0;bottom:66px;text-align:center;pointer-events:none}
#cap .t{font-size:30px;font-weight:600;letter-spacing:.04em;text-shadow:0 4px 24px rgba(0,0,0,.8);font-family:Lora,Georgia,"Times New Roman","Songti SC","SimSun",serif}
body:not(.L-en) #cap .t{letter-spacing:.32em}
#cap .n{font-size:11px;letter-spacing:.42em;color:var(--acc);font-weight:700;margin-bottom:8px}
#cap.show{animation:capIn .9s ease forwards}
#cap.hide{animation:capOut .5s ease forwards}
@keyframes capIn{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes capOut{to{opacity:0;transform:translateY(-8px)}}

#bar{left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:12px;align-items:center}
#dots{display:flex;gap:8px;align-items:center}
#dots button{all:unset;cursor:pointer;width:26px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
#dots button i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc)}
#dots button.done i{width:100%}
.ib{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#cbd5e1;background:rgba(12,14,22,.55);border:1px solid rgba(255,255,255,.12)}
.ib:hover{background:rgba(255,255,255,.12)}

#start{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(ellipse at 50% 50%,rgba(7,8,13,.45),rgba(7,8,13,.85));backdrop-filter:blur(3px);transition:opacity .7s}
#start.gone{opacity:0;pointer-events:none}
#start h1{font-size:46px;font-weight:800;letter-spacing:.08em}
#start h1 em{font-style:normal;color:var(--acc)}
#start p{font-size:15px;color:#94a3b8;letter-spacing:.06em}
#start .go{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 34px;border-radius:999px;font-size:18px;font-weight:700;color:#1a0c04;
  background:linear-gradient(90deg,#f97316,#fbbf24);box-shadow:0 12px 40px rgba(249,115,22,.4);margin-top:8px}
#start .go:hover{filter:brightness(1.08)}
#start .mute{all:unset;cursor:pointer;font-size:13px;color:#94a3b8;text-decoration:underline;text-underline-offset:4px}
#start .seg{margin-top:4px}
#flash{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,#fff 0%,rgba(255,255,255,.55) 45%,rgba(255,255,255,0) 80%);opacity:0;mix-blend-mode:screen}
#nogl{position:fixed;inset:0;display:none;place-items:center;font-size:16px;color:#94a3b8;text-align:center;padding:30px;z-index:30;background:#07080d}
</style>
</head>

/* ===================== math ===================== */
const fract=x=>x-Math.floor(x);
const hash=(i,j)=>fract(Math.sin(i*127.1+j*311.7)*43758.5453);
const sstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};

function vnoise(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  const i0=i&255,i1=(i+1)&255,j0=(j&255)<<8,j1=((j+1)&255)<<8;const a=NT[j0+i0],b=NT[j0+i1],c=NT[j1+i0],d=NT[j1+i1];
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,oc=4){let s=0,a=.5;for(let o=0;o<oc;o++){s+=a*vnoise(x,y);x*=2.03;y*=2.03;a*=.5;}return s/.94;}

const GX=new Float32Array(CNT),GZ=new Float32Array(CNT);
for(let j=0;j<M;j++)for(let i=0;i<N;i++){const k=j*N+i;GX[k]=i-(N-1)/2;GZ[k]=j-(M-1)/2;}
const BASE=new Float32Array(CNT);for(let k=0;k<CNT;k++)BASE[k]=.6+fbm(GX[k]*.06+7,GZ[k]*.06)*1.3;

/* visible ground area → content box */
const BOX={x0:-64,x1:64,z0:-36,z1:36};
function computeBox(){
  const asp=innerWidth/Math.max(1,innerHeight),p=.92,r=R0*Math.max(1,Math.pow((16/9)/asp,.85)),ty=3,tf=Math.tan(21*Math.PI/180);
  const e=[0,Math.sin(p)*r+ty,Math.cos(p)*r],z=[0,Math.sin(p),Math.cos(p)],x=[1,0,0],y=[0,Math.cos(p),-Math.sin(p)];
  const hit=(nx,ny,py)=>{const d=[0,1,2].map(q=>-z[q]+x[q]*nx*tf*asp+y[q]*ny*tf);if(d[1]>=-1e-4)return null;const t=(py-e[1])/d[1];return [e[0]+d[0]*t,e[2]+d[2]*t];};
  const top=hit(0,.84,9)||[0,-M/2],bot=hit(0,-.66,1)||[0,M/2],side=hit(.88,-.15,1)||[N/2,0];
  BOX.z0=Math.max(-(M-1)/2+2,top[1]);BOX.z1=Math.min((M-1)/2-2,bot[1]);
  BOX.x1=Math.min((N-1)/2-2,side[0]);BOX.x0=-BOX.x1;
}
const boxPx=()=>({x:(BOX.x0+(N-1)/2+.5)*SS,y:(BOX.z0+(M-1)/2+.5)*SS,w:(BOX.x1-BOX.x0)*SS,h:(BOX.z1-BOX.z0)*SS});

/* ===================== canvas → fields ===================== */
const FONT=s=>`900 ${s}px "Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Noto Sans SC","Segoe UI",Arial,sans-serif`;
const cv=document.createElement('canvas');cv.width=N*SS;cv.height=M*SS;
const cx=cv.getContext('2d',{willReadFrequently:true});
const cvB=document.createElement('canvas');cvB.width=cv.width;cvB.height=cv.height;const cxB=cvB.getContext('2d',{willReadFrequently:true});
function clearCv(){cx.setTransform(1,0,0,1,0,0);cx.filter='none';cx.fillStyle='#000';cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle='#fff';}
function sample(blurPx){       // per-cell average of R,G and blurred R
  const W=cv.width,src=cx.getImageData(0,0,W,cv.height).data;
  cxB.filter=`blur(${blurPx}px)`;cxB.fillStyle='#000';cxB.fillRect(0,0,W,cv.height);cxB.drawImage(cv,0,0);cxB.filter='none';
  const bl=cxB.getImageData(0,0,W,cv.height).data;
  const R=new Float32Array(CNT),G=new Float32Array(CNT),B=new Float32Array(CNT);
  for(let j=0;j<M;j++)for(let i=0;i<N;i++){let r=0,g=0,b=0;
    for(let y=0;y<SS;y++)for(let x=0;x<SS;x++){const p=((j*SS+y)*W+i*SS+x)*4;r+=src[p];g+=src[p+1];b+=bl[p];}
    const k=j*N+i,d=SS*SS*255;R[k]=r/d;G[k]=g/d;B[k]=b/d;}
  return {R,G,B};
}
function fitLines(lines){const b=boxPx();let size=b.h*.82/(1+(lines.length-1)*1.2);cx.font=FONT(size);
  const w=Math.max(...lines.map(l=>cx.measureText(l).width));if(w>b.w*.94)size*=b.w*.94/w;return size;}
const CJK=/[\u2e80-\u9fff\uf900-\ufaff\uff00-\uffef\u3000-\u303f]/;
function tokens(s){return s.match(/[\u2e80-\u9fff\uf900-\ufaff\uff00-\uffef\u3000-\u303f]|[^\s\u2e80-\u9fff\uf900-\ufaff\uff00-\uffef\u3000-\u303f]+|\s+/g)||[];}
function wrap(str,n){
  if(n<=1)return [str];
  if(CJK.test(str)&&!/\s/.test(str)){const c=[...str],per=Math.ceil(c.length/n),L=[];for(let i=0;i<c.length;i+=per)L.push(c.slice(i,i+per).join(''));return L;}
  cx.font=FONT(100);const tk=tokens(str),w=tk.map(t=>cx.measureText(t).width),tot=w.reduce((a,b)=>a+b,0);
  const L=Array.from({length:n},()=>'');let acc=0;
  tk.forEach((t,i)=>{L[Math.min(n-1,Math.floor((acc+w[i]/2)/tot*n))]+=t;acc+=w[i];});
  return L.map(l=>l.trim()).filter(Boolean);
}
function bestLines(str){let best=null;for(let n=1;n<=3;n++){const L=wrap(str,n);if(L.length<n)break;const s=fitLines(L);if(!best||s>best.s*1.3)best={L,s};}return best;}
function textField(str){
  const {L,s}=bestLines(str);clearCv();cx.font=FONT(s);cx.textAlign='center';cx.textBaseline='middle';
  const bp=boxPx(),cy=bp.y+bp.h/2;
  L.forEach((l,k)=>cx.fillText(l,bp.x+bp.w/2,cy+(k-(L.length-1)/2)*s*1.2+s*.04));
  const {R,B}=sample(s*.07);
  const h=new Float32Array(CNT),g=new Float32Array(CNT),tw=new Float32Array(CNT),ord=new Float32Array(CNT);
  for(let k=0;k<CNT;k++){const v=sstep(.18,.62,R[k]);h[k]=BASE[k]+v*(4.8+3*B[k]);g[k]=v;ord[k]=v;}
  return {h,g,tw,tint:null,ord,lines:L};
}
let MASK=null;
function logoField(){
  clearCv();const bp=boxPx(),ar=MASK.width/MASK.height;let H=bp.h*.96,W=H*ar;if(W>bp.w*.8){W=bp.w*.8;H=W/ar;}
  const x0=bp.x+(bp.w-W)/2,y0=bp.y+(bp.h-H)/2;cx.drawImage(MASK,x0,y0,W,H);
  const {R,G,B}=sample(H*.012);
  const h=new Float32Array(CNT),g=new Float32Array(CNT),tw=new Float32Array(CNT),tint=new Float32Array(CNT*3),ord=new Float32Array(CNT);
  const zc=(y0/SS)-(M-1)/2-.5,zh=H/SS,xl=x0/SS-(N-1)/2;
  const o1=hex('#e2603a'),o2=hex('#f6b26b'),cream=hex('#fff4e6');
  for(let k=0;k<CNT;k++){
    const t=sstep(.25,.6,R[k]),d=sstep(.25,.6,G[k])*(1-t),fz=Math.min(1,Math.max(0,(GZ[k]-zc)/zh));
    h[k]=BASE[k]*(1-Math.max(t,d)*.6)+d*2.6+t*(5.5+2.5*B[k]);
    g[k]=t*.35+d*.08;
    if(t>.02){tw[k]=t;tint.set(cream,k*3);}
    else if(d>.02){tw[k]=d;const c=o1.map((v,q)=>v+(o2[q]-v)*fz);tint.set(c,k*3);}
    ord[k]=t?2+(GX[k]-xl)/(W/SS):d?1:0;   // 0 ground · 1 diamond · 2..3 letters left→right
  }
  return {h,g,tw,tint,ord};
}

      h+=gCur[k]*.55*Math.sin(x*.16-T*3.2);                                 // ripple travelling through the letters
      const w=x-scan+z*.25;if(w>-6&&w<6)g+=Math.exp(-w*w/8)*.7;}
    if(hover.amp>.01){const d2=(x-hover.x)**2+(z-hover.z)**2;if(d2<200){const b=Math.exp(-d2/32)*hover.amp;h+=b*3.2;g+=b*.55;}}
    for(const s of shocks){const a=T-s.t0,d=Math.hypot(x-s.x,z-s.z),w=d-a*42;if(w>-8&&w<8){const b=Math.exp(-w*w/10)*Math.exp(-a*1.1);h+=b*6;g+=b*.8;}}
    hBuf[k]=Math.max(.12,h);gBuf[k]=Math.min(1.2,g);
    tBuf[k*4]=tcCur[k*3];tBuf[k*4+1]=tcCur[k*3+1];tBuf[k*4+2]=tcCur[k*3+2];tBuf[k*4+3]=twCur[k];
  }
  const db=document.querySelectorAll('#dots button');if(db[sceneIdx])db[sceneIdx].firstChild.style.width=Math.min(100,sceneT/S[sceneIdx].dur*100)+'%';
}
function draw(){
  gl.bindBuffer(gl.ARRAY_BUFFER,hB);gl.bufferSubData(gl.ARRAY_BUFFER,0,hBuf);
  gl.bindBuffer(gl.ARRAY_BUFFER,gB);gl.bufferSubData(gl.ARRAY_BUFFER,0,gBuf);
  gl.bindBuffer(gl.ARRAY_BUFFER,tB);gl.bufferSubData(gl.ARRAY_BUFFER,0,tBuf);
  gl.uniform3fv(U.uC,palCur.slice(0,12));gl.uniform3fv(U.uGlow,palCur.slice(12,15));gl.uniform3fv(U.uBg,palCur.slice(15,18));gl.uniform1f(U.uEdge,palCur[18]);
  gl.clearColor(palCur[15],palCur[16],palCur[17],1);document.body.style.background=`rgb(${palCur.slice(15,18).map(v=>v*255|0)})`;
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.uniformMatrix4fv(U.uVP,false,camMatrix());
  gl.uniform3fv(U.uCam,cam.eye);gl.uniform1f(U.uGap,.9);gl.uniform1f(U.uHmax,HMAX);gl.uniform1f(U.uTime,T);
  const R=(cam.r-dolly)*Math.max(1,Math.pow((16/9)/cam.aspect,.85));gl.uniform2f(U.uFog,R*.95,R*2.3);
  gl.drawArraysInstanced(gl.TRIANGLES,0,VERTS,CNT);
}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing)update(dt);draw();requestAnimationFrame(frame);}

/* =====================================================================
   SOUND — synthesized live with Web Audio (no audio files, works offline)
   ===================================================================== */
const Audio=(()=>{
  let ctx=null,G=null,on=false,nextBeat=0,beatN=0,chord=0,timer=null,energy=0;
  // A minor, ~84 BPM; one chord per scene
  const CH=[[220,261.63,329.63,392],[174.61,220,261.63,329.63],[261.63,329.63,392,493.88],[196,246.94,293.66,392],[146.83,174.61,220,261.63]];
  const BASS=[55,43.65,65.41,49,36.71];
  const BEAT=60/84;
  function graph(){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const g=v=>{const n=ctx.createGain();n.gain.value=v;return n;};
    G={master:g(0),music:g(.5),sfx:g(.8)};
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3.5;
    G.master.connect(comp);comp.connect(ctx.destination);G.music.connect(G.master);G.sfx.connect(G.master);
    G.rev=ctx.createConvolver();const len=ctx.sampleRate*3.2|0,ir=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);}
    G.rev.buffer=ir;const ro=g(.5);G.rev.connect(ro);ro.connect(G.master);
    const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;G.noise=nb;
  }
  const vca=(w,a,p,d,dest)=>{const n=ctx.createGain();n.gain.setValueAtTime(.0001,w);n.gain.linearRampToValueAtTime(p,w+a);n.gain.exponentialRampToValueAtTime(.0001,w+a+d);n.connect(dest);return n;};
  const osc=(type,f0,f1,w,dur,dest,det=0)=>{const o=ctx.createOscillator();o.type=type;o.detune.value=det;o.frequency.setValueAtTime(f0,w);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,w+dur);o.connect(dest);o.start(w);o.stop(w+dur+.05);};
  const nz=(w,dur,dest)=>{const s=ctx.createBufferSource();s.buffer=G.noise;s.loop=true;s.connect(dest);s.start(w,Math.random());s.stop(w+dur+.05);};
  const flt=(type,f,Q,dest)=>{const b=ctx.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=Q;b.connect(dest);return b;};
  const send=(n,a)=>{const s=ctx.createGain();s.gain.value=a;n.connect(s);s.connect(G.rev);};
  const pan=(a,b,w,d,dest)=>{const p=ctx.createStereoPanner();p.pan.setValueAtTime(a,w);p.pan.linearRampToValueAtTime(b,w+d);p.connect(dest);return p;};
  const S={
    whoosh(w,dur=1.1){const g=vca(w,dur*.45,.45,dur*.6,G.sfx);send(g,.35);const f=flt('bandpass',250,1.2,pan(-.8,.8,w,dur,g));
      f.frequency.setValueAtTime(250,w);f.frequency.exponentialRampToValueAtTime(3200,w+dur*.5);f.frequency.exponentialRampToValueAtTime(500,w+dur);nz(w,dur+.1,f);},
    rumble(w,dur){const g=ctx.createGain();g.gain.setValueAtTime(.0001,w);g.gain.linearRampToValueAtTime(.32,w+dur*.4);g.gain.exponentialRampToValueAtTime(.0001,w+dur);g.connect(G.sfx);
      nz(w,dur,flt('lowpass',140,1,g));osc('sine',48,38,w,dur,g);},
    impact(w,a=1){const g=vca(w,.005,.9*a,1.1,G.sfx);send(g,.5);osc('sine',130,34,w,1,g);const g2=vca(w,.002,.35*a,.4,G.sfx);nz(w,.4,flt('lowpass',1100,.7,g2));},
    clicks(w,dur,n){for(let i=0;i<n;i++){const t=w+Math.pow(Math.random(),.8)*dur,g=vca(t,.001,.05+Math.random()*.05,.03,G.sfx);nz(t,.04,flt('bandpass',2000+Math.random()*3500,2,g));}},
    chime(w,notes,gap=.09,v=.11){notes.forEach((f,i)=>{const t=w+i*gap,g=vca(t,.01,v,2.6,G.sfx);send(g,.75);osc('triangle',f,f,t,2.7,g);osc('sine',f*2,f*2,t,1.4,vca(t,.01,v*.3,1.2,G.sfx));});},
    shimmer(w){[1568,1976,2349,2637,3136,3951].forEach((f,i)=>{const t=w+i*.06,g=vca(t,.01,.05,1.6,G.sfx);send(g,.8);osc('sine',f,f,t,1.7,g);});},
    pad(w,ch,dur){ch.forEach((f,i)=>{const g=ctx.createGain();g.gain.setValueAtTime(.0001,w);g.gain.linearRampToValueAtTime(.05,w+1.2);g.gain.setValueAtTime(.05,w+dur-.6);g.gain.linearRampToValueAtTime(.0001,w+dur+.8);
      g.connect(G.music);send(g,.6);const lp=flt('lowpass',1100,.7,g);lp.frequency.setValueAtTime(600,w);lp.frequency.linearRampToValueAtTime(1800,w+dur*.6);
      osc('sawtooth',f,f,w,dur+1,lp,-7);osc('sawtooth',f,f,w,dur+1,lp,7);});},
    bass(w,f){const g=vca(w,.01,.3,BEAT*1.6,G.music);const lp=flt('lowpass',380,3,g);osc('sawtooth',f,f,w,BEAT*1.8,lp);osc('sine',f,f,w,BEAT*1.8,g);},
    pluck(w,f,v=.07){const g=vca(w,.004,v,.5,G.music);send(g,.45);const lp=flt('lowpass',2600,1,g);lp.frequency.setValueAtTime(3200,w);lp.frequency.exponentialRampToValueAtTime(700,w+.4);osc('triangle',f,f,w,.55,lp);},
    kick(w,v=.55){const g=vca(w,.002,v,.32,G.music);osc('sine',140,42,w,.3,g);},
    hat(w,v=.06){const g=vca(w,.001,v,.05,G.music);nz(w,.06,flt('highpass',8000,.7,g));},
    burst(w,v=.5){const g=vca(w,.003,v,.7,G.sfx);send(g,.5);nz(w,.75,flt('bandpass',900,.6,g));S.impact(w,.9);},
    downsweep(w,dur,v=.18){const g=vca(w,.05,v,dur,G.sfx);send(g,.4);const lp=flt('lowpass',3000,2,g);lp.frequency.setValueAtTime(3000,w);lp.frequency.exponentialRampToValueAtTime(120,w+dur);
      osc('sawtooth',520,55,w,dur,lp);nz(w,dur,flt('lowpass',1500,1,vca(w,.05,v*.6,dur,G.sfx)));},
    swirl(w,dur){const g=vca(w,dur*.3,.32,dur*.7,G.sfx);send(g,.6);const p=pan(-.9,.9,w,dur,g),f=flt('bandpass',500,4,p);
      for(let i=0;i<=8;i++)f.frequency.linearRampToValueAtTime(i%2?2600:450,w+dur*i/8);nz(w,dur+.1,f);},
    laser(w,dur){const g=ctx.createGain();g.gain.setValueAtTime(.0001,w);g.gain.linearRampToValueAtTime(.09,w+.08);g.gain.setValueAtTime(.09,w+dur-.2);g.gain.linearRampToValueAtTime(.0001,w+dur);g.connect(pan(-.9,.9,w,dur,G.sfx));send(g,.4);
      const lp=flt('lowpass',2400,6,g);osc('sawtooth',90,90,w,dur,lp);osc('square',180,186,w,dur,lp);
      for(let i=0;i<3;i++){const t=w+i*.09,z=vca(t,.002,.12,.12,G.sfx);osc('square',2400,300,t,.12,flt('lowpass',4000,1,z));}},
    stutter(w,dur){for(let t=0,i=0;t<dur;t+=BEAT/4,i++){const z=vca(w+t,.002,.08,.07,G.sfx);send(z,.25);osc('square',[880,1318.5,1046.5,1568][i%4],[880,1318.5,1046.5,1568][i%4],w+t,.08,flt('lowpass',3000,1,z));}},
    blips(w,dur,n){for(let i=0;i<n;i++){const t=w+Math.random()*dur,f=200+Math.random()*2400,z=vca(t,.001,.06,.04,G.sfx);osc('square',f,f*(Math.random()<.5?.5:2),t,.05,z);}},
    riser(w,dur){const g=ctx.createGain();g.gain.setValueAtTime(.0001,w);g.gain.exponentialRampToValueAtTime(.35,w+dur);g.gain.exponentialRampToValueAtTime(.0001,w+dur+.08);g.connect(G.sfx);send(g,.45);
      const f=flt('bandpass',250,2,g);f.frequency.setValueAtTime(250,w);f.frequency.exponentialRampToValueAtTime(6000,w+dur);nz(w,dur+.1,f);osc('sawtooth',110,880,w,dur,flt('lowpass',1800,1,g));},
    arp(w,ch,dur){const n=12;for(let i=0;i<n;i++){const f=ch[i%4]*Math.pow(2,Math.floor(i/4));S.pluck(w+i*dur/n,f*2,.06);}}
  };
  function tick(){             // music scheduler (look-ahead)
    if(!on||!playing)return;
    const ahead=ctx.currentTime+.18;
    while(nextBeat<ahead){
      const w=Math.max(nextBeat,ctx.currentTime),ch=CH[chord],b=beatN%8;
      if(b%2===0)S.bass(w,BASS[chord]);
      if(energy>0){S.kick(w,b%4===0?.5:.32);S.hat(w+BEAT/2,.05);}
      const arp=[0,2,1,3,2,1,3,2][b],oct=b>=4?2:1;
      S.pluck(w,ch[arp]*oct,.055);if(energy>0)S.pluck(w+BEAT/2,ch[(arp+2)%4]*2,.03);
      nextBeat+=BEAT;beatN++;
    }
  }
  function scene(sc,P){
    if(!on)return;
    const w=ctx.currentTime+.02,i=sc.kind==='logo'?0:sc.i+1;chord=i%CH.length;energy=sc.kind==='logo'?0:1;
    S.pad(w,CH[chord],sc.dur);
    // ① exit
    if(P.hasExit)({explode:()=>S.burst(w+.12,.45),melt:()=>S.downsweep(w,1.1),shatter:()=>{S.clicks(w,.7,46);S.blips(w,.6,14);},sink:()=>S.downsweep(w,.8,.12)})[P.exit]();
    // ② interlude
    ({ring:()=>{S.whoosh(w+.3,1.3);S.impact(w+.45,.55);},spiral:()=>S.swirl(w+.3,1.6),scan:()=>S.laser(w+.3,1.9),
      eq:()=>S.stutter(w+.35,1.4),boil:()=>S.rumble(w+.25,1.8)})[P.inter]();
    // ③ entry
    if(P.entry==='logo'){S.riser(w+.6,1.1);S.clicks(w+1.25,1.1,40);S.impact(w+1.9,.7);S.laser(w+2.0,1.75);S.impact(w+3.75,.8);S.shimmer(w+3.8);
      S.chime(w+3.85,[440,523.25,659.25,880,1046.5],.11,.09);return;}
    ({drop:()=>{S.clicks(w+1.1,1.3,70);S.impact(w+2.15,.8);},print:()=>{S.laser(w+1.1,1.3);S.clicks(w+1.1,1.3,30);},
      pop:()=>S.arp(w+1.1,CH[chord],1.25),glitch:()=>S.blips(w+1.1,1.3,40),rise:()=>S.riser(w+.9,1.4)})[P.entry]();
    S.impact(w+2.45,.6);S.chime(w+2.5,CH[chord].map(f=>f*2),.08,.1);
  }
  return{
    start(){if(!ctx)graph();ctx.resume();on=true;nextBeat=ctx.currentTime+.1;G.master.gain.cancelScheduledValues(ctx.currentTime);G.master.gain.setTargetAtTime(.85,ctx.currentTime,.08);
      if(!timer)timer=setInterval(tick,40);},
    stop(){on=false;if(ctx){G.master.gain.setTargetAtTime(0,ctx.currentTime,.06);}},
    pause(p){if(!ctx)return;p?ctx.suspend():on&&ctx.resume();if(!p)nextBeat=ctx.currentTime+.05;},
    scene,boom(){if(on)S.impact(ctx.currentTime+.01,.6);},
    get on(){return on;}
  };
})();

/* ===================== UI ===================== */
const SPK_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const SPK_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z" fill="currentColor"/><path d="M22 9l-6 6M16 9l6 6"/></svg>';
const PLAY='<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',PAUSE='<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
function drawSnd(){const b=$('#snd'),o=Audio.on;b.classList.toggle('on',o);
  b.innerHTML=(o?SPK_ON:SPK_OFF)+`<span class="lz">${o?'音效 开':'音效 关'}</span><span class="le">${o?'Sound on':'Sound off'}</span>`+(o?'<span class="eq"><i></i><i></i><i></i></span>':'');}
function drawDots(){const n=scenes().length;const d=$('#dots');
  if(d.children.length!==n)d.innerHTML=Array.from({length:n},(_,i)=>`<button data-i="${i}"><i></i></button>`).join('');
  [...d.children].forEach((b,i)=>{b.classList.toggle('done',i<sceneIdx);if(i!==sceneIdx)b.firstChild.style.width=i<sceneIdx?'100%':'0';});}
$('#dots').onclick=e=>{const b=e.target.closest('button');if(b)goScene(+b.dataset.i);};
function setLang(l,restart){LANG=l;store.set('showLang',l);document.body.classList.toggle('L-en',l==='en');document.documentElement.lang=l==='en'?'en':'zh-CN';
  document.querySelectorAll('#lang button,#lang2 button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  if(restart)goScene(sceneIdx);}
document.querySelectorAll('#lang button,#lang2 button').forEach(b=>b.onclick=()=>setLang(b.dataset.l,true));
function setRot(v){rotating=v;$('#rot').classList.toggle('on',v);}
$('#rot').onclick=()=>setRot(!rotating);
$('#snd').onclick=()=>{Audio.on?Audio.stop():(Audio.start(),Audio.scene({...scenes()[sceneIdx],dur:Math.max(1,scenes()[sceneIdx].dur-sceneT)}));drawSnd();};
function setPlay(v){playing=v;$('#pp').innerHTML=v?PAUSE:PLAY;Audio.pause(!v);}
$('#pp').onclick=()=>setPlay(!playing);
$('#prev').onclick=()=>goScene(sceneIdx-1);$('#next').onclick=()=>goScene(sceneIdx+1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')goScene(sceneIdx+1);else if(e.key==='ArrowLeft')goScene(sceneIdx-1);
  else if(e.code==='Space'){e.preventDefault();setPlay(!playing);}
  else if(e.key==='m'||e.key==='M')$('#snd').click();
  else if(e.key==='r'||e.key==='R')setRot(!rotating);
  else if(e.key==='l'||e.key==='L')setLang(LANG==='en'?'zh':'en',true);
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();}
});
let idleT;const wake=()=>{document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),3000);};
['pointermove','pointerdown','keydown'].forEach(ev=>addEventListener(ev,wake));wake();
function begin(withSound){$('#start').classList.add('gone');if(withSound)Audio.start();drawSnd();T=0;goScene(0);}
$('#goSnd').onclick=()=>begin(true);$('#goMute').onclick=()=>begin(false);

/* ===================== boot ===================== */
setLang(LANG==='en'?'en':'zh');setPlay(true);setRot(false);drawSnd();
const img=new Image();img.onload=()=>{MASK=img;goScene(0);
  if(qs.has('autostart'))begin(false);
  requestAnimationFrame(frame);};
img.src=LOGO_MASK;
window.__show={goScene,setLang,advance:(s,fps=60)=>{for(let i=0;i<s*fps;i++)update(1/fps);draw();},begin};
</script>
